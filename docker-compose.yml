services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ycode
      POSTGRES_PASSWORD: ycode
      POSTGRES_DB: ycode
    ports:
      - '5432:5432'
    volumes:
      - ycode_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ycode -d ycode']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ycode_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ycode
      MINIO_ROOT_PASSWORD: ycodeycode
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ycode_minio:/data

volumes:
  ycode_pg:
  ycode_redis:
  ycode_minio:
